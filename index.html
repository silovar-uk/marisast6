<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MODERN MARISA LAB｜技</title>
<meta name="description" content="モダンマリーザの公式フレームデータ84行を、帯・表・つながりで見切る。">
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="lab.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">MODERN <span>MARISA</span> LAB</div>
    <nav class="nav" aria-label="ページ">
      <a id="tab-waza" data-tab="waza" href="index.html" aria-current="page">技</a>
      <a id="tab-jokyo" data-tab="jokyo" href="situations.html">状況</a>
    </nav>
    <p class="basis" id="basis">公式フレームデータを読み込み中</p>
  </header>

  <section id="waza">
    <div class="tools">
      <div class="chips" id="cats" role="group" aria-label="技の種類"></div>
      <input class="search" id="q" type="search" placeholder="技名・入力で探す（/）" aria-label="技を探す">
      <div class="views" role="group" aria-label="表示">
        <button id="view-band" aria-pressed="true">帯</button>
        <button id="view-table" aria-pressed="false">表</button>
      </div>
      <label class="pun" for="pun-on"><input id="pun-on" type="checkbox"> 確反ものさし
        <input id="pun-n" type="range" min="2" max="20" value="6" aria-label="相手の不利フレーム">
        <output id="pun-out" for="pun-n">相手−6</output>
      </label>
    </div>
    <div class="legend" aria-label="帯の色">
      <span><i style="background:var(--f-start)"></i>発生まで</span>
      <span><i style="background:var(--f-act)"></i>持続（攻撃判定）</span>
      <span><i style="background:var(--f-rec)"></i>硬直</span>
      <span><i class="k-armor"></i>アーマー</span>
      <span><i class="k-inv"></i>完全無敵</span>
      <span><i class="k-aainv"></i>対空無敵</span>
      <span><i style="background:var(--l-air);height:3px"></i>空中</span>
      <span><i style="background:var(--l-proj);height:3px"></i>弾無敵</span>
      <span><i style="border:1.5px dashed var(--text);background:none"></i>派生受付</span>
      <span>1マス=1F</span>
    </div>
    <div id="focus"></div>
    <div class="lab">
      <div id="list" class="list" aria-live="polite"></div>
      <aside id="detail" class="detail" aria-label="技の詳細"></aside>
    </div>
    <p class="note">出典: CAPCOM公式フレームデータ（モダン表示）。キャンセルの受付フレームと、距離による届く・届かないは公式表にないため出していません。「資料由来」の点線は既存サイトの攻略資料（2026年3月基準）で、再確認が必要です。</p>
  </section>

  <section id="jokyo" hidden>
    <div class="sit-tools"><button type="button" id="export-notebook" class="export-btn">ノートをJSONで書き出す</button></div>
    <div class="scenes chips" id="scenes"></div>
    <div class="sits" id="sits"></div>
    <p class="note">既存の状況逆引きと作戦ノートを統合。候補技を比べ、必要な場面だけ技ページへ持ち込めます。</p>
  </section>
</div>
<div class="backdrop" id="backdrop" hidden></div>
<script src="data/lab-data.js"></script>
<script src="lab-core.js"></script>
<script src="lab.js"></script>
</body>
</html>
