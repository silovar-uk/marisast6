name: Advantage page check

on:
  pull_request:
    paths:
      - "advantage.html"
      - "advantage-page.js"
      - "advantage-page.css"
      - "page-guides.js"
      - "page-guides.css"
      - "data-core.js"
      - "year4-phase*.js"
      - "version.json"
      - ".github/scripts/validate-site.js"
      - ".github/workflows/advantage-page-check.yml"
  push:
    branches: [main]
    paths:
      - "advantage.html"
      - "advantage-page.js"
      - "advantage-page.css"
      - "page-guides.js"
      - "page-guides.css"
      - "data-core.js"
      - "year4-phase*.js"
      - "version.json"
      - ".github/scripts/validate-site.js"
      - ".github/workflows/advantage-page-check.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check data-core.js
          node --check page-guides.js
          node --check advantage-page.js
          node --check .github/scripts/validate-site.js

      - name: Validate August 3 site and frame-gap model
        run: node .github/scripts/validate-site.js

      - name: Check advantage page structure
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('advantage.html').read_text(encoding='utf-8')
          required = [
              '2026年8月3日調整',
              '有利だから、<em>何が埋まる？</em>',
              'advantage-page.css?v=0.23.2',
              'advantage-page.js?v=0.23.2',
              'plus-move-list',
              'calc-advantage',
          ]
          missing = [token for token in required if token not in html]
          if missing:
              raise SystemExit(f'advantage page missing: {missing}')
          PY
