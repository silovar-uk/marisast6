name: Validate personal training home

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "drill.html"
      - "data-core.js"
      - "year4-phase*.js"
      - "home-*.js"
      - "home-*.css"
      - "drill-*.js"
      - "combo-learning-data.js"
      - "page-guides.js"
      - "page-guides.css"
      - ".github/scripts/validate-site.js"
      - ".github/workflows/home-dashboard.yml"
  push:
    branches: [main]
    paths:
      - "index.html"
      - "drill.html"
      - "data-core.js"
      - "year4-phase*.js"
      - "home-*.js"
      - "drill-*.js"
      - "combo-learning-data.js"
      - "page-guides.js"
      - ".github/scripts/validate-site.js"
      - ".github/workflows/home-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-home:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate home JavaScript syntax
        run: |
          set -euo pipefail
          for file in data-core.js home-practice-plan.js home-dashboard.js drill-focus.js; do
            node --check "$file"
          done

      - name: Validate August 3 data and public wiring
        run: node .github/scripts/validate-site.js

      - name: Check home-specific elements
        run: |
          node <<'NODE'
          const fs = require('fs');
          const home = fs.readFileSync('index.html', 'utf8');
          const drill = fs.readFileSync('drill.html', 'utf8');
          for (const token of [
            'id="home-dashboard"',
            'home-dashboard.css?v=0.23.2',
            'home-practice-plan.js?v=0.23.2',
            'home-dashboard.js?v=0.23.2',
            'href="advantage.html"',
            '2026年8月3日調整',
            'ワンボタン対空・牽制'
          ]) {
            if (!home.includes(token)) throw new Error(`Home wiring missing: ${token}`);
          }
          if (drill.indexOf('drill-focus.js?v=0.23.2') >= drill.indexOf('drill-decision-engine.js?v=0.23.2')) {
            throw new Error('drill-focus.js must load before the decision engine');
          }
          console.log('Home and drill wiring passed.');
          NODE
