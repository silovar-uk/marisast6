name: Validate static site

on:
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - ".nojekyll"
      - "README.md"
      - "version.json"
      - ".github/scripts/**"
      - ".github/workflows/**"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-static-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          find .github/scripts -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Validate August 3 Year 4 site
        run: node .github/scripts/validate-site.js

      - name: Validate readability and tactical additions
        run: node .github/scripts/validate-readability-tactics.js

      - name: Validate contrast across public pages
        run: node .github/scripts/validate-contrast.js

      - name: Validate semantic icons and reduced text density
        run: node .github/scripts/validate-icon-system.js

      - name: Validate immersive fight lab experience
        run: node .github/scripts/validate-immersive-lab.js

      - name: Validate branch-based Pages readiness
        run: node .github/scripts/validate-pages-workflow.js
