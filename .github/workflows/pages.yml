name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          for file in \
            app.js \
            moves-page.js \
            moves-practical-cues.js \
            followups-data.js \
            followups-engine.js \
            strategy-gallery.js \
            strategy-practical-cues.js \
            strategy-combo-learning.js \
            combo-learning-data.js \
            playbook-data.js \
            playbook-expanded.js \
            drill-data.js \
            drill-route-schema.js \
            drill-scenarios.js \
            drill-result-analysis.js \
            drill-focus.js \
            drill-decision-engine.js \
            drill-tier-explanation.js \
            situations.js \
            situations-data-v2.js \
            situations-adapter.js \
            situations-page.js \
            learning-links.js \
            learning-flow-enhancer.js \
            data-core.js \
            data-{1..6}.js; do
            node --check "$file"
          done

      - name: Validate core move and situation data
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.createContext(context);

          const run = file => {
            vm.runInContext(fs.readFileSync(file, 'utf8'), context, { filename: file });
          };

          for (const file of [
            'data-core.js',
            'situations.js',
            'data-1.js',
            'data-2.js',
            'data-3.js',
            'data-4.js',
            'data-5.js',
            'data-6.js'
          ]) run(file);

          const data = context.window.MARISA_DATA;
          if (!data) throw new Error('MARISA_DATA was not created');

          const moveIds = new Set(data.moves.map(move => move.id));
          const situations = data.situationGroups.flatMap(group => group.situations);

          if (data.moves.length !== 48) throw new Error(`Expected 48 moves, got ${data.moves.length}`);
          if (moveIds.size !== data.moves.length) throw new Error('Move IDs must be unique');
          if (data.situationGroups.length !== 8) throw new Error(`Expected 8 situation groups, got ${data.situationGroups.length}`);
          if (situations.length !== 40) throw new Error(`Expected 40 legacy situations, got ${situations.length}`);
          if (new Set(situations.map(item => item.id)).size !== situations.length) throw new Error('Situation IDs must be unique');

          const unknownRefs = situations.flatMap(item =>
            item.moves.filter(id => !moveIds.has(id)).map(id => `${item.id}:${id}`)
          );
          if (unknownRefs.length) throw new Error(`Unknown move references: ${unknownRefs.join(', ')}`);

          console.log(`Core validation passed: ${data.moves.length} moves and ${situations.length} situations.`);
          NODE

      - name: Validate combo route schema and decision drill
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.createContext(context);
          const run = file => vm.runInContext(fs.readFileSync(file, 'utf8'), context, { filename: file });

          for (const file of [
            'data-core.js',
            'data-1.js',
            'data-2.js',
            'data-3.js',
            'data-4.js',
            'data-5.js',
            'data-6.js',
            'drill-data.js',
            'drill-route-schema.js',
            'drill-scenarios.js'
          ]) run(file);

          const drill = context.window.MARISA_DRILL;
          const routes = drill?.routes || [];
          const scenarios = context.window.MARISA_DECISION_DRILL?.scenarios || [];
          const routeById = new Map(routes.map(route => [route.id, route]));
          const tiers = new Set(['stable', 'standard', 'maximum']);

          if (drill.schemaVersion !== 2) throw new Error(`Expected route schema v2, got ${drill.schemaVersion}`);
          if (drill.schemaErrors?.length) throw new Error(`Route schema errors: ${drill.schemaErrors.join(', ')}`);
          if (routes.length !== 24) throw new Error(`Expected 24 combo routes, got ${routes.length}`);
          if (new Set(routes.map(route => route.id)).size !== routes.length) throw new Error('Route IDs must be unique');

          for (const route of routes) {
            if (!tiers.has(route.tier)) throw new Error(`${route.id} has invalid tier: ${route.tier}`);
            if (!Array.isArray(route.objectives) || !route.objectives.length) throw new Error(`${route.id} needs objectives`);
            if (!Array.isArray(route.positions) || !route.positions.length) throw new Error(`${route.id} needs positions`);
            if (!Number.isInteger(route.resources?.driveCost) || route.resources.driveCost < 0) throw new Error(`${route.id} has invalid driveCost`);
            if (!Number.isInteger(route.resources?.saCost) || route.resources.saCost < 0) throw new Error(`${route.id} has invalid saCost`);
            if (![1, 2, 3].includes(route.inputDifficulty)) throw new Error(`${route.id} has invalid inputDifficulty`);
            if (![1, 2, 3].includes(route.reliability)) throw new Error(`${route.id} has invalid reliability`);
            if (!route.learning?.use || !route.learning?.fallback || !route.learning?.upgrade) throw new Error(`${route.id} needs learning guidance`);
          }

          if (context.window.MARISA_DECISION_DRILL?.definitionMode !== 'query') throw new Error('Decision drill must use query definitions');
          if (scenarios.length !== 18) throw new Error(`Expected 18 decision scenarios, got ${scenarios.length}`);
          if (new Set(scenarios.map(item => item.id)).size !== scenarios.length) throw new Error('Decision scenario IDs must be unique');

          for (const scenario of scenarios) {
            if (scenario.definitionMode !== 'query' || !scenario.selection) throw new Error(`${scenario.id} is not query-built`);
            if (scenario.choices.length !== 3) throw new Error(`${scenario.id} must have exactly 3 choices`);
            if (!scenario.choices.includes(scenario.correct)) throw new Error(`${scenario.id} does not include its correct route`);
            if (new Set(scenario.choices).size !== 3) throw new Error(`${scenario.id} has duplicate choices`);
            const missing = scenario.choices.filter(id => !routeById.has(id));
            if (missing.length) throw new Error(`${scenario.id} has missing routes: ${missing.join(', ')}`);
            const starters = new Set(scenario.choices.map(id => routeById.get(id).starter));
            if (starters.size !== 1) throw new Error(`${scenario.id} choices must share the same starter`);
            const correctRoute = routeById.get(scenario.correct);
            if (scenario.resolvedSelection?.correctTier !== correctRoute.tier) throw new Error(`${scenario.id} resolved tier mismatch`);
          }

          const tierCounts = Object.fromEntries([...tiers].map(tier => [tier, routes.filter(route => route.tier === tier).length]));
          if (Object.values(tierCounts).some(count => count === 0)) throw new Error(`Every tier needs routes: ${JSON.stringify(tierCounts)}`);

          console.log(`Route schema passed: ${routes.length} routes (${JSON.stringify(tierCounts)}) and ${scenarios.length} query-built scenarios.`);
          NODE

      - name: Validate tier-based drill analysis
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.createContext(context);
          const run = file => vm.runInContext(fs.readFileSync(file, 'utf8'), context, { filename: file });

          for (const file of [
            'data-core.js',
            'data-1.js',
            'data-2.js',
            'data-3.js',
            'data-4.js',
            'data-5.js',
            'data-6.js',
            'drill-data.js',
            'drill-route-schema.js',
            'drill-scenarios.js',
            'drill-result-analysis.js'
          ]) run(file);

          const analysis = context.window.MARISA_DRILL_ANALYSIS;
          if (!analysis) throw new Error('MARISA_DRILL_ANALYSIS was not created');
          if (analysis.version !== '1.0.0') throw new Error(`Unexpected analysis version: ${analysis.version}`);

          const cases = [
            {
              label: 'stable correct, maximum selected',
              result: { scenarioId: 'stable-amp-normal', routeId: 'aMP-normal-power', correctRouteId: 'aMP-normal-basic', type: 'wrong', elapsedMs: 2100 },
              flags: ['foundationGap', 'overextend']
            },
            {
              label: 'maximum correct, stable selected',
              result: { scenarioId: 'power-amp-carry', routeId: 'aMP-normal-basic', correctRouteId: 'aMP-normal-power', type: 'wrong', elapsedMs: 2300 },
              flags: ['underconvert']
            },
            {
              label: 'same tier, wrong condition',
              result: { scenarioId: 'confirm-amp-counter', routeId: 'aMP-punish-basic', correctRouteId: 'aMP-counter-basic', type: 'wrong', elapsedMs: 1800 },
              flags: ['conditionMiss']
            },
            {
              label: 'stable timeout',
              result: { scenarioId: 'stable-crlp-normal', routeId: null, correctRouteId: 'crLP-normal-basic', type: 'timeout', elapsedMs: 8000 },
              flags: ['foundationGap', 'timeout']
            }
          ];

          const enriched = cases.map(test => {
            const value = analysis.enrichResult(test.result);
            if (JSON.stringify(value.diagnosticFlags) !== JSON.stringify(test.flags)) {
              throw new Error(`${test.label}: expected ${test.flags.join('+')}, got ${(value.diagnosticFlags || []).join('+')}`);
            }
            return value;
          });

          const scenarioById = Object.fromEntries(context.window.MARISA_DECISION_DRILL.scenarios.map(item => [item.id, item]));
          const summary = analysis.summarizeSession(enriched, scenarioById);
          const expected = { foundationGap: 2, overextend: 1, underconvert: 1, conditionMiss: 1, timeout: 1 };
          for (const [key, count] of Object.entries(expected)) {
            if (summary.diagnostics[key] !== count) throw new Error(`Diagnostic count mismatch: ${key}=${summary.diagnostics[key]}, expected ${count}`);
          }
          if (summary.tierStats.stable.total !== 2 || summary.tierStats.standard.total !== 1 || summary.tierStats.maximum.total !== 1) {
            throw new Error(`Tier totals are wrong: ${JSON.stringify(summary.tierStats)}`);
          }
          if (summary.tierStats.stable.averageMs !== 2100) throw new Error(`Stable average should exclude timeout: ${summary.tierStats.stable.averageMs}`);

          const attempt = analysis.createAttempt({
            at: 1,
            config: { category: 'all', speed: 'standard', questionCount: 4 },
            total: 4,
            accuracy: 0,
            averageMs: 2067,
            totals: { correct: 0, wrong: 3, timeout: 1 },
            analysis: summary
          });
          const history = analysis.buildHistorySummary([attempt]);
          if (history.attempts !== 1 || history.recentMisses.length !== 4) throw new Error('History summary did not retain detailed misses');
          if (history.suggestedScenarioIds.length !== 4) throw new Error('History summary did not build suggested scenarios');

          console.log(`Drill analysis passed: ${Object.entries(summary.diagnostics).map(([key, value]) => `${key}=${value}`).join(', ')}.`);
          NODE

      - name: Validate strategy combo learning roadmap
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.createContext(context);
          const run = file => vm.runInContext(fs.readFileSync(file, 'utf8'), context, { filename: file });

          for (const file of [
            'data-core.js',
            'data-1.js',
            'data-2.js',
            'data-3.js',
            'data-4.js',
            'data-5.js',
            'data-6.js',
            'playbook-data.js',
            'playbook-expanded.js',
            'drill-data.js',
            'drill-route-schema.js',
            'drill-scenarios.js',
            'combo-learning-data.js'
          ]) run(file);

          const drill = context.window.MARISA_DRILL;
          const playbook = context.window.MARISA_PLAYBOOK;
          const scenarios = context.window.MARISA_DECISION_DRILL?.scenarios || [];
          const learning = context.window.MARISA_COMBO_LEARNING;

          if (!learning) throw new Error('MARISA_COMBO_LEARNING was not created');
          if (learning.errors?.length) throw new Error(`Combo learning registry errors: ${learning.errors.join(', ')}`);
          if (learning.families.length !== 8) throw new Error(`Expected 8 learning families, got ${learning.families.length}`);

          const routeById = new Map(drill.routes.map(route => [route.id, route]));
          const cardById = new Map(playbook.cards.map(card => [card.id, card]));
          const scenarioIds = new Set(scenarios.map(item => item.id));
          const familyIds = new Set();
          const assignedRoutes = [];
          const tierRank = { stable: 0, standard: 1, maximum: 2 };
          const graph = new Map();

          for (const family of learning.families) {
            if (familyIds.has(family.id)) throw new Error(`Duplicate learning family: ${family.id}`);
            familyIds.add(family.id);

            const entryCard = cardById.get(family.entry?.cardId);
            if (!entryCard) throw new Error(`Unknown entry card: ${family.id}:${family.entry?.cardId}`);
            if (entryCard.category !== 'combo') throw new Error(`Entry card must be a combo card: ${family.entry.cardId}`);
            if (!family.routes.length) throw new Error(`Learning family has no routes: ${family.id}`);

            for (const item of family.routes) {
              const route = routeById.get(item.routeId);
              const card = cardById.get(item.cardId);
              if (!route) throw new Error(`Unknown learning route: ${item.routeId}`);
              if (!card) throw new Error(`Unknown learning card: ${item.routeId}:${item.cardId}`);
              if (card.category !== 'combo') throw new Error(`Learning card must be in combo category: ${item.cardId}`);
              if (learning.routeToCard[item.routeId] !== item.cardId) throw new Error(`routeToCard mismatch: ${item.routeId}`);

              assignedRoutes.push(item.routeId);
              graph.set(item.routeId, item.prerequisites || []);

              for (const prerequisiteId of item.prerequisites || []) {
                const prerequisite = routeById.get(prerequisiteId);
                if (!prerequisite) throw new Error(`Unknown prerequisite: ${item.routeId}:${prerequisiteId}`);
                if (prerequisiteId === item.routeId) throw new Error(`Route cannot depend on itself: ${item.routeId}`);
                if (tierRank[prerequisite.tier] > tierRank[route.tier]) throw new Error(`Tier goes backwards: ${item.routeId} <- ${prerequisiteId}`);
              }

              const scenarioId = learning.scenarioByRoute[item.routeId];
              if (scenarioId && !scenarioIds.has(scenarioId)) throw new Error(`Unknown practice scenario: ${item.routeId}:${scenarioId}`);
            }
          }

          if (assignedRoutes.length !== drill.routes.length) throw new Error(`Expected ${drill.routes.length} assigned routes, got ${assignedRoutes.length}`);
          if (new Set(assignedRoutes).size !== assignedRoutes.length) throw new Error('Learning routes must be assigned exactly once');
          const missingRoutes = drill.routes.map(route => route.id).filter(id => !assignedRoutes.includes(id));
          if (missingRoutes.length) throw new Error(`Unassigned learning routes: ${missingRoutes.join(', ')}`);

          for (const [cardId, routeIds] of Object.entries(learning.cardToRoutes)) {
            if (!cardById.has(cardId)) throw new Error(`Unknown reverse-mapped card: ${cardId}`);
            for (const routeId of routeIds) {
              if (learning.routeToCard[routeId] !== cardId) throw new Error(`cardToRoutes mismatch: ${cardId}:${routeId}`);
            }
          }

          const visiting = new Set();
          const visited = new Set();
          const visit = routeId => {
            if (visiting.has(routeId)) throw new Error(`Prerequisite cycle detected at ${routeId}`);
            if (visited.has(routeId)) return;
            visiting.add(routeId);
            for (const prerequisiteId of graph.get(routeId) || []) visit(prerequisiteId);
            visiting.delete(routeId);
            visited.add(routeId);
          };
          for (const routeId of assignedRoutes) visit(routeId);

          console.log(`Combo learning roadmap passed: ${learning.families.length} families and ${assignedRoutes.length} routes.`);
          NODE

      - name: Validate learning flow links
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {}, URLSearchParams };
          vm.createContext(context);
          const run = file => vm.runInContext(fs.readFileSync(file, 'utf8'), context, { filename: file });

          for (const file of [
            'data-core.js',
            'situations.js',
            'data-1.js',
            'data-2.js',
            'data-3.js',
            'data-4.js',
            'data-5.js',
            'data-6.js',
            'playbook-data.js',
            'playbook-expanded.js',
            'situations-data-v2.js',
            'situations-adapter.js',
            'drill-data.js',
            'drill-route-schema.js',
            'drill-scenarios.js',
            'learning-links.js'
          ]) run(file);

          const data = context.window.MARISA_DATA;
          const playbook = context.window.MARISA_PLAYBOOK;
          const finder = context.window.MARISA_SITUATIONS;
          const drill = context.window.MARISA_DECISION_DRILL;
          const links = context.window.MARISA_LEARNING_LINKS;

          const ids = {
            move: new Set(data.moves.map(item => item.id)),
            strategy: new Set(playbook.cards.map(item => item.id)),
            situation: new Set(finder.items.map(item => item.id)),
            scenario: new Set(drill.scenarios.map(item => item.id))
          };

          const registries = [
            ['scenario', links.scenarioLinks],
            ['situation', links.situationLinks],
            ['strategy', links.strategyLinks],
            ['move', links.moveLinks]
          ];

          for (const [type, registry] of registries) {
            for (const key of Object.keys(registry)) {
              if (!ids[type].has(key)) throw new Error(`Unknown ${type} registry key: ${key}`);
            }
          }

          const allLinks = registries.flatMap(([, registry]) => Object.values(registry).flat());
          for (const link of allLinks) {
            const url = new URL(link.href, 'https://example.test/');
            if (link.type === 'move') {
              const id = url.searchParams.get('move');
              if (!ids.move.has(id)) throw new Error(`Unknown move link: ${link.href}`);
            }
            if (link.type === 'drill') {
              const id = url.searchParams.get('scenario');
              if (!ids.scenario.has(id)) throw new Error(`Unknown drill link: ${link.href}`);
            }
            if (link.type === 'situation') {
              const id = url.searchParams.get('situation');
              if (id && !ids.situation.has(id)) throw new Error(`Unknown situation link: ${link.href}`);
            }
            if (link.type === 'strategy') {
              const match = url.hash.match(/^#playbook\/[^/]+\/([^/]+)/);
              if (!match || !ids.strategy.has(decodeURIComponent(match[1]))) throw new Error(`Unknown strategy link: ${link.href}`);
            }
          }

          console.log(`Learning flow validation passed: ${allLinks.length} cross-page links.`);
          NODE

      - name: Validate favicon wiring
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pages = ['index.html', 'situations.html', 'moves.html', 'strategy.html', 'drill.html'];
          const faviconLink = '<link rel="icon" href="favicon.svg" type="image/svg+xml" />';

          if (!fs.existsSync('favicon.svg')) throw new Error('favicon.svg is missing');
          for (const page of pages) {
            const html = fs.readFileSync(page, 'utf8');
            if (!html.includes(faviconLink)) throw new Error(`${page} does not reference favicon.svg`);
          }
          console.log(`Favicon validation passed for ${pages.length} public pages.`);
          NODE

      - name: Audit expanded strategy and Situation Finder data
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.createContext(context);

          const run = file => {
            vm.runInContext(fs.readFileSync(file, 'utf8'), context, { filename: file });
          };

          for (const file of [
            'data-core.js',
            'situations.js',
            'data-1.js',
            'data-2.js',
            'data-3.js',
            'data-4.js',
            'data-5.js',
            'data-6.js',
            'playbook-data.js',
            'playbook-expanded.js',
            'situations-data-v2.js',
            'situations-adapter.js'
          ]) run(file);

          const data = context.window.MARISA_DATA;
          const playbook = context.window.MARISA_PLAYBOOK;
          const finder = context.window.MARISA_SITUATIONS;

          if (!playbook) throw new Error('MARISA_PLAYBOOK was not created');
          if (!finder) throw new Error('MARISA_SITUATIONS was not created');

          const moveIds = new Set(data.moves.map(move => move.id));
          const cardIds = new Set(playbook.cards.map(card => card.id));
          const finderIds = new Set(finder.items.map(item => item.id));

          if (cardIds.size !== playbook.cards.length) throw new Error('Playbook card IDs must be unique');
          if (finderIds.size !== finder.items.length) throw new Error('Finder situation IDs must be unique');
          if (finder.schemaVersion !== 2) throw new Error(`Expected situation schema v2, got ${finder.schemaVersion}`);

          const unknownMoveRefs = finder.items.flatMap(item =>
            (item.links?.moves || [])
              .map(move => typeof move === 'string' ? move : move.id)
              .filter(id => id && !moveIds.has(id))
              .map(id => `${item.id}:${id}`)
          );
          if (unknownMoveRefs.length) throw new Error(`Unknown Finder move references: ${unknownMoveRefs.join(', ')}`);

          const unknownCardRefs = finder.items.flatMap(item =>
            (item.links?.strategyCards || [])
              .map(card => typeof card === 'string' ? card : card.id)
              .filter(id => id && !cardIds.has(id))
              .map(id => `${item.id}:${id}`)
          );
          if (unknownCardRefs.length) throw new Error(`Unknown strategy card references: ${unknownCardRefs.join(', ')}`);

          console.log(`Expanded audit passed: ${playbook.cards.length} cards and ${finder.items.length} Finder situations.`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
