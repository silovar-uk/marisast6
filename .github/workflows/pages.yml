name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          for file in \
            app.js \
            moves-page.js \
            moves-practical-cues.js \
            followups-data.js \
            followups-engine.js \
            strategy-gallery.js \
            strategy-practical-cues.js \
            playbook-data.js \
            playbook-expanded.js \
            drill-data.js \
            drill-scenarios.js \
            drill-decision-engine.js \
            situations.js \
            situations-data-v2.js \
            situations-adapter.js \
            situations-page.js \
            data-core.js \
            data-{1..6}.js; do
            node --check "$file"
          done

      - name: Validate core move and situation data
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.createContext(context);

          const run = file => {
            vm.runInContext(fs.readFileSync(file, 'utf8'), context, { filename: file });
          };

          for (const file of [
            'data-core.js',
            'situations.js',
            'data-1.js',
            'data-2.js',
            'data-3.js',
            'data-4.js',
            'data-5.js',
            'data-6.js'
          ]) run(file);

          const data = context.window.MARISA_DATA;
          if (!data) throw new Error('MARISA_DATA was not created');

          const moveIds = new Set(data.moves.map(move => move.id));
          const situations = data.situationGroups.flatMap(group => group.situations);

          if (data.moves.length !== 48) throw new Error(`Expected 48 moves, got ${data.moves.length}`);
          if (moveIds.size !== data.moves.length) throw new Error('Move IDs must be unique');
          if (data.situationGroups.length !== 8) throw new Error(`Expected 8 situation groups, got ${data.situationGroups.length}`);
          if (situations.length !== 40) throw new Error(`Expected 40 legacy situations, got ${situations.length}`);
          if (new Set(situations.map(item => item.id)).size !== situations.length) throw new Error('Situation IDs must be unique');

          const unknownRefs = situations.flatMap(item =>
            item.moves.filter(id => !moveIds.has(id)).map(id => `${item.id}:${id}`)
          );
          if (unknownRefs.length) throw new Error(`Unknown move references: ${unknownRefs.join(', ')}`);

          console.log(`Core validation passed: ${data.moves.length} moves and ${situations.length} situations.`);
          NODE

      - name: Validate combo decision drill
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.createContext(context);
          const run = file => vm.runInContext(fs.readFileSync(file, 'utf8'), context, { filename: file });

          for (const file of [
            'data-core.js',
            'data-1.js',
            'data-2.js',
            'data-3.js',
            'data-4.js',
            'data-5.js',
            'data-6.js',
            'drill-data.js',
            'drill-scenarios.js'
          ]) run(file);

          const routes = context.window.MARISA_DRILL?.routes || [];
          const scenarios = context.window.MARISA_DECISION_DRILL?.scenarios || [];
          const routeById = new Map(routes.map(route => [route.id, route]));

          if (scenarios.length !== 18) throw new Error(`Expected 18 decision scenarios, got ${scenarios.length}`);
          if (new Set(scenarios.map(item => item.id)).size !== scenarios.length) throw new Error('Decision scenario IDs must be unique');

          for (const scenario of scenarios) {
            if (scenario.choices.length !== 3) throw new Error(`${scenario.id} must have exactly 3 choices`);
            if (!scenario.choices.includes(scenario.correct)) throw new Error(`${scenario.id} does not include its correct route`);
            if (new Set(scenario.choices).size !== 3) throw new Error(`${scenario.id} has duplicate choices`);
            const missing = scenario.choices.filter(id => !routeById.has(id));
            if (missing.length) throw new Error(`${scenario.id} has missing routes: ${missing.join(', ')}`);
            const starters = new Set(scenario.choices.map(id => routeById.get(id).starter));
            if (starters.size !== 1) throw new Error(`${scenario.id} choices must share the same starter`);
          }

          console.log(`Decision drill validation passed: ${scenarios.length} scenarios, all with comparable 3-choice routes.`);
          NODE

      - name: Validate favicon wiring
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pages = ['index.html', 'situations.html', 'moves.html', 'strategy.html', 'drill.html'];
          const faviconLink = '<link rel="icon" href="favicon.svg" type="image/svg+xml" />';

          if (!fs.existsSync('favicon.svg')) throw new Error('favicon.svg is missing');
          for (const page of pages) {
            const html = fs.readFileSync(page, 'utf8');
            if (!html.includes(faviconLink)) throw new Error(`${page} does not reference favicon.svg`);
          }
          console.log(`Favicon validation passed for ${pages.length} public pages.`);
          NODE

      - name: Audit expanded strategy and Situation Finder data
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const context = { window: {} };
          vm.createContext(context);

          const run = file => {
            vm.runInContext(fs.readFileSync(file, 'utf8'), context, { filename: file });
          };

          for (const file of [
            'data-core.js',
            'situations.js',
            'data-1.js',
            'data-2.js',
            'data-3.js',
            'data-4.js',
            'data-5.js',
            'data-6.js',
            'playbook-data.js',
            'playbook-expanded.js',
            'situations-data-v2.js',
            'situations-adapter.js'
          ]) run(file);

          const data = context.window.MARISA_DATA;
          const playbook = context.window.MARISA_PLAYBOOK;
          const finder = context.window.MARISA_SITUATIONS;

          if (!playbook) throw new Error('MARISA_PLAYBOOK was not created');
          if (!finder) throw new Error('MARISA_SITUATIONS was not created');

          const moveIds = new Set(data.moves.map(move => move.id));
          const cardIds = new Set(playbook.cards.map(card => card.id));
          const finderIds = new Set(finder.items.map(item => item.id));

          if (cardIds.size !== playbook.cards.length) throw new Error('Playbook card IDs must be unique');
          if (finderIds.size !== finder.items.length) throw new Error('Finder situation IDs must be unique');
          if (finder.schemaVersion !== 2) throw new Error(`Expected situation schema v2, got ${finder.schemaVersion}`);

          const unknownMoveRefs = finder.items.flatMap(item =>
            (item.links?.moves || [])
              .map(move => typeof move === 'string' ? move : move.id)
              .filter(id => id && !moveIds.has(id))
              .map(id => `${item.id}:${id}`)
          );
          if (unknownMoveRefs.length) throw new Error(`Unknown Finder move references: ${unknownMoveRefs.join(', ')}`);

          const unknownCardRefs = finder.items.flatMap(item =>
            (item.links?.strategyCards || [])
              .map(card => typeof card === 'string' ? card : card.id)
              .filter(id => id && !cardIds.has(id))
              .map(id => `${item.id}:${id}`)
          );
          if (unknownCardRefs.length) throw new Error(`Unknown strategy card references: ${unknownCardRefs.join(', ')}`);

          console.log(`Expanded audit passed: ${playbook.cards.length} cards and ${finder.items.length} Finder situations.`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
