name: Validate static site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-static-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Check JavaScript syntax
        run: |
          node --check lab-core.js
          if [ -f lab.js ]; then node --check lab.js; fi
          node --check data/lab-data.js
          node --check tools/extract-official.js
          node --check tools/validate.mjs
      - name: Validate data and public contract
        run: node tools/validate.mjs