name: Deploy static site to Pages

on:
  pull_request:
    branches: [main]
    paths:
      - "*.html"
      - "*.js"
      - "*.css"
      - "README.md"
      - "version.json"
      - ".github/scripts/**"
      - ".github/workflows/**"
      - ".github/PAGES_RESET_ONCE"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Production deployments must finish in order. A new manual run or push waits
# instead of cancelling the Pages deployment that is already in progress.
# Pull-request validation can still replace stale runs from the same PR.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'pages-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate JavaScript syntax
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          find .github/scripts -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Validate August 3 Year 4 site
        run: node .github/scripts/validate-site.js

      - name: Validate readability and tactical additions
        run: node .github/scripts/validate-readability-tactics.js

      - name: Validate contrast across public pages
        run: node .github/scripts/validate-contrast.js

      - name: Validate semantic icons and reduced text density
        run: node .github/scripts/validate-icon-system.js

      - name: Validate immersive fight lab experience
        run: node .github/scripts/validate-immersive-lab.js

      - name: Validate Pages deployment queue safety
        run: node .github/scripts/validate-pages-workflow.js

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reset stuck Pages site once
        if: ${{ hashFiles('.github/PAGES_RESET_ONCE') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GH_REPOSITORY}/pages"
          code=$(curl --silent --show-error --location \
            --output /tmp/pages-delete-response.json \
            --write-out '%{http_code}' \
            --request DELETE \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$api")
          if [ "$code" != "204" ] && [ "$code" != "404" ]; then
            cat /tmp/pages-delete-response.json || true
            echo "Unexpected Pages delete response: HTTP $code" >&2
            exit 1
          fi
          echo "Pages site reset accepted with HTTP $code. Waiting for the old queue to clear."
          sleep 20

      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: ${{ hashFiles('.github/PAGES_RESET_ONCE') != '' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
